add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[username]
show_always = false
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

[git_branch]
style = "bold purple"
symbol = ""
format = " on [$symbol$branch]($style)"
truncation_length = 20

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "~"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
style = "bold yellow"
format = " [py $version]($style)"
detect_files = ["*.py", "pyproject.toml", "requirements.txt", ".python-version"]

[nodejs]
style = "bold green"
format = " [node $version]($style)"
detect_files = ["package.json"]

[rust]
style = "bold red"
format = " [rs $version]($style)"
detect_files = ["Cargo.toml"]

[cmd_duration]
min_time = 3_000
style = "bold yellow"
format = " took [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
